<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="conteneur">
    <h1>Créer un compte</h1>

    <p class="erreur" th:if="${erreur}" th:text="${erreur}"></p>

    <form th:action="@{/inscription}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="motDePasse">Mot de passe (6 caractères min.)</label>
        <input type="password" id="motDePasse" name="motDePasse" minlength="6" required>

        <button type="submit">S'inscrire</button>
    </form>

    <p>Déjà un compte ? <a th:href="@{/login}">Se connecter</a></p>
</div>
</body>
</html>
