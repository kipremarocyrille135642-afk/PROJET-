<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }
        body::before { width: 400px; height: 400px; top: -150px; left: -150px; }
        body::after { width: 300px; height: 300px; bottom: -100px; right: -100px; }

        .carte {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            width: 380px;
            overflow: hidden;
            z-index: 1;
        }
        .entete {
            background: linear-gradient(135deg, #0f172a, #334155);
            color: white;
            padding: 2.5rem 2rem 2rem;
            text-align: center;
        }
        .entete .icone { font-size: 3rem; margin-bottom: 0.5rem; }
        .entete h1 { margin: 0; font-size: 1.4rem; }
        .entete p { margin: 0.3rem 0 0; opacity: 0.75; font-size: 0.9rem; }

        .corps { padding: 1.5rem 2rem 2rem; }
        .lien-carte {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.9rem 1rem; margin-bottom: 0.8rem;
            border: 1px solid #e5e7eb; border-radius: 10px;
            text-decoration: none; color: #1a1a1a; font-weight: 500;
        }
        .lien-carte:hover { background: #f4f5f7; }
        .lien-carte .emoji { font-size: 1.3rem; }

        a.retour {
            display: block; margin-top: 0.5rem; text-align: center;
            color: #64748b; text-decoration: none; font-size: 0.9rem;
        }

        button {
            margin-top: 1rem; width: 100%; padding: 0.8rem;
            background: #fee2e2; color: #dc2626; border: none; border-radius: 8px;
            font-size: 0.9rem; cursor: pointer; font-weight: 600;
        }
        button:hover { background: #fecaca; }
    </style>
</head>
<body>
<div class="carte">
    <div class="entete">
        <div class="icone">🔐</div>
        <h1>Espace Administrateur</h1>
        <p th:text="${email}"></p>
    </div>
    <div class="corps">
        <a th:href="@{/admin/notes}" class="lien-carte">
            <span class="emoji">📝</span> Gérer les notes
        </a>

        <a th:href="@{/accueil}" class="retour">← Retour à l'accueil</a>

        <form th:action="@{/deconnexion}" method="post">
            <button type="submit">Se déconnecter</button>
        </form>
    </div>
</div>
</body>
</html>
