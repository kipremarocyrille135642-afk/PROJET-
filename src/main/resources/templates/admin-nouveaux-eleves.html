<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New students - EduTrack</title>
    <style>
        :root { --bleu:#1e3a5f; --bordure:#e2e5ea; --gris:#6b7280; }
        * { box-sizing: border-box; }
        body { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f5f7fa; color: #1a1a1a; }
        .barre { background: linear-gradient(90deg, #1e3a5f, #2d5a8e); color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; font-weight: 700; flex-wrap: wrap; gap: .5rem; }
        .barre a { color: #fff; text-decoration: none; font-weight: 600; font-size: .88rem; }
        .page { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: grid; gap: 1.2rem; }
        .carte { background: #fff; border: 1px solid #e8ecf1; border-radius: 14px; padding: 1.5rem; box-shadow: 0 6px 24px rgba(30,58,95,.07); }
        h2 { margin: 0 0 1rem; font-size: 1.05rem; color: var(--bleu); }
        .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .8rem; }
        label { display: block; font-size: .78rem; font-weight: 600; color: #374151; margin-bottom: .3rem; }
        input, select { width: 100%; padding: .65rem .8rem; border: 1px solid var(--bordure); border-radius: 10px; font-size: .9rem; font-family: inherit; background: #fafbfc; }
        button { border: none; border-radius: 10px; padding: .7rem 1.2rem; font-weight: 700; cursor: pointer; background: var(--bleu); color: #fff; font-family: inherit; }
        .suppr { background: #fee2e2; color: #b91c1c; padding: .4rem .7rem; font-size: .78rem; }
        .tableau { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 760px; }
        th, td { text-align: left; padding: .6rem .7rem; border-bottom: 1px solid #eef1f4; }
        th { background: #eef2f7; color: var(--bleu); }
        .ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: .7rem 1rem; border-radius: 10px; margin: 0; }
        .ko { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: .7rem 1rem; border-radius: 10px; margin: 0; }
        .recherche { display: flex; gap: .6rem; margin-bottom: 1rem; }
        .recherche input { flex: 1; }
        select.statut { padding: .35rem .5rem; font-size: .8rem; width: auto; }
    </style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"></head>
<body>
<div class="barre"><span>EduTrack &mdash; New students</span><a th:href="@{/admin/notes}">&larr; Admin panel</a></div>
<div class="page">
    <p class="ok" th:if="${succesMessage}" th:text="${succesMessage}"></p>
    <p class="ko" th:if="${erreur}" th:text="${erreur}"></p>

    <div class="carte">
        <h2>Register a new student</h2>
        <form th:action="@{/admin/nouveaux-eleves}" method="post">
            <div class="grille">
                <div><label>Last name</label><input type="text" name="nom" required></div>
                <div><label>First name</label><input type="text" name="prenom" required></div>
                <div><label>Email</label><input type="email" name="email" required></div>
                <div><label>Phone</label><input type="text" name="telephone"></div>
                <div><label>Date of birth</label><input type="date" name="dateNaissance"></div>
                <div><label>Program</label><input type="text" name="filiere" value="BCA"></div>
                <div><label>Semester</label>
                    <select name="semestre"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
                </div>
            </div>
            <p style="margin-top:1rem"><button type="submit">Register student</button></p>
        </form>
    </div>

    <div class="carte">
        <h2>Registered students (<span th:text="${#lists.size(eleves)}"></span>)</h2>
        <form class="recherche" th:action="@{/admin/nouveaux-eleves}" method="get">
            <input type="text" name="q" th:value="${q}" placeholder="Search by name or email...">
            <button type="submit">Search</button>
        </form>
        <div class="tableau">
            <table>
                <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Birth date</th><th>Program</th><th>Sem.</th><th>Status</th><th>Registered</th><th></th></tr></thead>
                <tbody>
                <tr th:each="e : ${eleves}">
                    <td th:text="${e.nom} + ' ' + ${e.prenom}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.telephone}"></td>
                    <td th:text="${e.dateNaissance}"></td>
                    <td th:text="${e.filiere}"></td>
                    <td th:text="${e.semestre}"></td>
                    <td>
                        <form th:action="@{'/admin/nouveaux-eleves/' + ${e.id} + '/statut'}" method="post" style="margin:0;">
                            <select class="statut" name="statut" onchange="this.form.submit()">
                                <option th:selected="${e.statut == 'Pending'}" value="Pending">Pending</option>
                                <option th:selected="${e.statut == 'Accepted'}" value="Accepted">Accepted</option>
                                <option th:selected="${e.statut == 'Rejected'}" value="Rejected">Rejected</option>
                            </select>
                        </form>
                    </td>
                    <td th:text="${e.dateInscription}"></td>
                    <td>
                        <form th:action="@{'/admin/nouveaux-eleves/' + ${e.id} + '/supprimer'}" method="post" style="margin:0;" onsubmit="return confirm('Delete this record?');">
                            <button type="submit" class="suppr">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(eleves)}"><td colspan="9">No student registered yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
