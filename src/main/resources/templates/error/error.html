<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - EduTrack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0; min-height: 100vh;
            background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 2rem;
        }
        .marque {
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            font-size: 1.3rem; font-weight: 800; color: #1e3a5f; margin-bottom: 2.5rem;
        }
        .code { font-size: 5rem; font-weight: 800; color: #1e3a5f; margin: 0; font-family: Georgia, serif; }
        h1 { font-size: 1.3rem; color: #1a1a1a; margin: 0.5rem 0 0.8rem; }
        p { color: #666; max-width: 420px; margin: 0 auto 2rem; }
        a.retour {
            display: inline-block; padding: 0.8rem 1.8rem;
            background: #1e3a5f; color: white; text-decoration: none;
            border-radius: 8px; font-weight: 700; font-size: 0.9rem;
        }
        a.retour:hover { background: #14263f; }
    </style>
</head>
<body>
<div>
    <div class="marque">🎓 EduTrack</div>
    <p class="code" th:text="${status != null ? status : '?'}"></p>
    <h1>Oops, something went wrong</h1>
    <p>The page you're looking for doesn't exist, or an unexpected error occurred. Don't worry, your data is safe.</p>
    <a th:href="@{/accueil}" class="retour">← Back to home</a>
</div>
</body>
</html>
